[mod-setting-name]
tree-collision-tree-box-size=Tree collision box size
tree-collision-affect-plants=Also shrink planted trees
tree-collision-plant-box-size=Planted tree collision box size
tree-collision-preserve-density=Preserve forest density

[mod-setting-description]
tree-collision-tree-box-size=Width and height, in tiles, of the collision box given to naturally generated trees. The vanilla value is about 0.8. Trees whose collision box is already smaller than this are left alone. Set to 0 to remove tree collision entirely.
tree-collision-affect-plants=Applies the same treatment to Space Age plants: the plantable Nauvis tree and the Gleba fruit trees. Turn this off to leave farmed trees at their vanilla size.
tree-collision-plant-box-size=Width and height, in tiles, of the collision box given to Space Age plants. Lowering this also lets you hand-plant trees closer together.
tree-collision-preserve-density=Keeps the original collision box for map generation only, so forests are generated exactly as dense as in vanilla. Turn this off to let the map generator pack trees together as tightly as the new collision box allows.
